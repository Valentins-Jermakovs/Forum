services:
  forum-db:
    image: mongo:8
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: app_user
      MONGO_INITDB_ROOT_PASSWORD: app_password
      MONGO_INITDB_DATABASE: forum_db

    ports:
      - "27017:27017"

    volumes:
      - forum_db_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend-network

  forum:
    build:
      context: .
      dockerfile: src/Dockerfile

    restart: unless-stopped

    depends_on:
      forum-db:
        condition: service_healthy

    ports:
      - "8002:8002"

    env_file:
      - .env

    environment:
      DATABASE_URL: mongodb://app_user:app_password@forum-db:27017/forum_db?authSource=admin

    networks:
      - backend-network

volumes:
  forum_db_data:

networks:
  backend-network:
    name: backend-network
    external: true